name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish built app to docs
        run: |
          mkdir -p docs/ivan
          cp dist/index.html docs/index.html
          cp public/ivan/ivan1.glb docs/ivan/ivan1.glb
          cp "public/ivan/Slow Run1.glb" "docs/ivan/Slow Run1.glb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/ivan/
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish latest build"
          git push
